# breakbox-security CI. The security repo: BreakBox Studio (Peek/Keygen/Flip), the shared
# scan set, and the monitoring design. Max-Anton Horvat. Complex Software Systems (S6). 0x4D414836.
#
# This repo is the HOME of the security scan set. The plan is that breakbox-web and breakbox-api
# call a reusable `scan.yml` published here, so one owned-by-security set runs in every repo.
#
# build-test and codeql need BreakBox.Core + BreakBox.Generator from GitHub Packages (published by
# breakbox-api). They stay gated until that supply-chain step is done (Settings > Variables:
# PACKAGES_READY=true, and a read:packages token in secrets.PACKAGES_TOKEN). gitleaks runs always.

name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    if: ${{ vars.PACKAGES_READY == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          source-url: https://nuget.pkg.github.com/AntonDesigns/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - run: dotnet build BreakBox.Security.sln -c Release
      - run: dotnet test BreakBox.Security.sln -c Release --no-build

  dependency-scan:
    if: ${{ vars.PACKAGES_READY == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          source-url: https://nuget.pkg.github.com/AntonDesigns/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - run: dotnet restore BreakBox.Security.sln
      - name: .NET vulnerable packages
        run: dotnet list BreakBox.Security.sln package --vulnerable --include-transitive

  codeql:
    if: ${{ vars.PACKAGES_READY == 'true' }}
    runs-on: windows-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          source-url: https://nuget.pkg.github.com/AntonDesigns/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
