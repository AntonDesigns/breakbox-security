# breakbox-security CI. The security repo: BreakBox Studio (Peek/Keygen/Flip), the shared
# scan set, and the monitoring design. Max-Anton Horvat. Complex Software Systems (S6). 0x4D414836.
#
# This repo is the HOME of the security scan set. The plan is that breakbox-web and breakbox-api
# call a reusable `scan.yml` published here, so one owned-by-security set runs in every repo.
#
# build-test and codeql need BreakBox.Core + BreakBox.Generator from GitHub Packages (published by
# breakbox-api). They stay gated until that supply-chain step is done (Settings > Variables:
# PACKAGES_READY=true, and a read:packages token in secrets.PACKAGES_TOKEN). gitleaks runs always.

name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run gitleaks via its CLI, the same as breakbox-api. It scans the full git history, needs only
      # the default contents:read, and does not pin a third-party action by tag (which is what
      # SonarCloud flags, S7637).
      - name: Secret scan (gitleaks)
        run: |
          curl -sSL --proto "=https" --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xzf - gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --redact --no-banner

  build-test:
    if: ${{ vars.PACKAGES_READY == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          source-url: https://nuget.pkg.github.com/AntonDesigns/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - run: dotnet build BreakBox.Security.sln -c Release
      - run: dotnet test BreakBox.Security.sln -c Release --no-build

  dependency-scan:
    if: ${{ vars.PACKAGES_READY == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          source-url: https://nuget.pkg.github.com/AntonDesigns/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - run: dotnet restore BreakBox.Security.sln
      - name: .NET vulnerable packages
        run: dotnet list BreakBox.Security.sln package --vulnerable --include-transitive

  codeql:
    if: ${{ vars.PACKAGES_READY == 'true' }}
    runs-on: windows-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          source-url: https://nuget.pkg.github.com/AntonDesigns/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # SonarCloud quality gate for the security repo (BreakBox Studio: the Peek/Keygen/Flip engines).
  # Coverage, maintainability, reliability and security hotspots (ISO/IEC 25010). Uses the SonarScanner
  # for .NET so it understands C# and reads real line coverage. This is a SEPARATE SonarCloud project
  # from breakbox-api (each repo is its own project).
  #
  # Gated until configured, same pattern as breakbox-api. To turn it on, in the repo's Settings:
  #   Variables: SONAR_ENABLED=true, SONAR_ORG=<sonarcloud org key>, SONAR_PROJECT_KEY=<this repo's key>,
  #              PACKAGES_READY=true
  #   Secrets:   SONAR_TOKEN=<a SonarCloud analysis token>, PACKAGES_TOKEN=<read:packages token>
  # It also needs the GitHub Packages feed, because the Studio tests consume BreakBox.Core/Generator
  # (published by breakbox-api). The Generator pin is 0.3.0, so breakbox-api must have published 0.3.0
  # first (merge the api PR before this one), or the restore fails like the other gated jobs.
  sonarqube:
    # startsWith (not == 'true') so a stray trailing space in the value can't silently skip it. Also
    # requires PACKAGES_READY, because it builds the solution that consumes the packages.
    if: ${{ startsWith(vars.SONAR_ENABLED, 'true') && vars.PACKAGES_READY == 'true' }}
    # Runs on Windows: Peek/Keygen are exercised against freshly generated WinForms targets, so those
    # tests are Windows-only. On Linux they would skip and the engines would show as uncovered, failing
    # the New Code coverage gate. "shell: bash" keeps the scanner script identical to breakbox-api's.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history, so Sonar can tell new code from old
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'        # the scanner runs on the JVM
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          source-url: https://nuget.pkg.github.com/AntonDesigns/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}   # the Core/Generator feed
      - name: Install the SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Analyse (build + tests with coverage)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Git Bash on Windows path-converts any argument starting with "/", so the scanner's
          # /k: /o: /d: flags arrive mangled. Exclude every argument from that MSYS conversion.
          MSYS2_ARG_CONV_EXCL: "*"
          MSYS_NO_PATHCONV: "1"
        run: |
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORG }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="docs/**" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/App.axaml.cs,**/MainWindow.axaml.cs"
          dotnet build BreakBox.Security.sln -c Release
          dotnet test BreakBox.Security.sln -c Release --no-build \
            --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
